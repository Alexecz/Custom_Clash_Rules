;Custom_Clash_Rules
;全分组防 DNS 泄漏订阅转换模板
;作者：https://github.com/Aethersailor
;项目地址：https://github.com/Aethersailor/Custom_Clash_Rules
;该订阅模板为 Custom_OpenClash_Rules 项目的衍生项目
;基于 ACL4SSR 模板魔改而来，感谢原作者！


[custom]
;设置规则标志位
;以下规则，按照从上往下的顺序遍历，优先命中上位规则
;修改顺序会影响分流效果

;---------- 局域网 / 自定义直连 / 公司业务 ----------
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
ruleset=🎯 全球直连,https://raw.githubusercontent.com/Alexecz/Custom_Clash_Rules/company/cpCustom_Direct.list,600
ruleset=📧 Zoho,https://raw.githubusercontent.com/Alexecz/Custom_Clash_Rules/company/Zoho_AU.list,600
ruleset=📧 Zoho,https://raw.githubusercontent.com/Alexecz/Custom_Clash_Rules/company/Zoho_Global.list,600
ruleset=🎯 全球直连,https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Custom_Direct.list,28800

;---------- Google 专项（需优先于 cpCustom_Proxy 和国内直连，避免 googleapis.com 宽泛规则或 google-cn 提前命中）----------
ruleset=🤖 Claude & Gemini,[]GEOSITE,google-gemini
ruleset=📹 YouTube,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list,28800
