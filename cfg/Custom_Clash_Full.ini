ruleset=🎯 全球直连,[]GEOSITE,category-games

;---------- 末端兜底 ----------
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Download/Download.list,28800
